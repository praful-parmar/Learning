trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  - group: test   # Replace with your actual variable group name

stages:
- stage: ReplaceAndPublish
  jobs:
  - job: ReplaceAndExport
    displayName: 'Replace tokens and publish .properties file'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - bash: |
        #!/bin/bash
        
        # Output file location
        OUTPUT_FILE="$(Build.ArtifactStagingDirectory)/variable_names.txt"
        
        # Common Azure DevOps system variable prefixes to exclude
        SYSTEM_PREFIXES=(
          "AGENT_" "BUILD_" "COMMON_" "PIPELINE_"
          "SYSTEM_" "TF_" "ENDPOINT_" "INPUT_"
          "SECRET_" "AZURE_"
        )
        
        # Get all environment variables and process them
        env | while IFS='=' read -r name _; do
          # Skip if empty
          [[ -z "$name" ]] && continue
          
          # Check against system prefixes
          is_system_var=false
          for prefix in "${SYSTEM_PREFIXES[@]}"; do
            if [[ "$name" == "$prefix"* ]]; then
              is_system_var=true
              break
            fi
          done
          
          # If not a system variable, include it
          if ! $is_system_var; then
            echo "$name"
          fi
        done > "$OUTPUT_FILE"
        
        # Display results
        echo "##[group]Extracted Variable Names"
        cat "$OUTPUT_FILE"
        echo "##[endgroup]"
        
        # Count variables found
        VAR_COUNT=$(wc -l < "$OUTPUT_FILE")
        echo "Found $VAR_COUNT variables in the group"
      displayName: 'Extract variable names (Bash)'

    - publish: $(Build.ArtifactStagingDirectory)/variable_names.txt
      artifact: VariableNames