trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  - group: test   # Replace with your actual variable group name

stages:
- stage: ReplaceAndPublish
  jobs:
  - job: ReplaceAndExport
    displayName: 'Replace tokens and publish .properties file'
    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - script: |
        echo "abc: $(key1)"
        echo "bcd: $(key2)"
      displayName: 'Print variable values'
    # Debug step: print the file contents before replacing tokens
    - script: cat $(System.DefaultWorkingDirectory)/application-prod_scheduler.properties
      displayName: 'Print file contents before token replacement'

    # Replace tokens
    - task: qetza.replacetokens.replacetokens-task.replacetokens@6
      displayName: 'Replace tokens in application-prod_scheduler.properties'
      inputs:
        targetFiles: '$(System.DefaultWorkingDirectory)/application-prod_scheduler.properties'
        tokenPrefix: '${'
        tokenSuffix: '}'
        actionOnMissing: 'warn'
        keepToken: false

    # Debug step: print the file contents after replacing tokens
    - script: cat $(System.DefaultWorkingDirectory)/application-prod_scheduler.properties
      displayName: 'Print file contents after token replacement'

    # Publish the modified file as an artifact
    - task: PublishBuildArtifacts@1
      displayName: 'Publish properties file as artifact'
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/application-prod_scheduler.properties'
        ArtifactName: 'scheduler-config'
        publishLocation: 'Container'
